name: GSC health

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Check live GSC signals
        run: bash scripts/site-analytics/check-gsc-signals.sh

      - name: Check ColorfulBOX ranking / DTI signals
        continue-on-error: true
        run: bash scripts/site-analytics/check-ranking-signals.sh
