name: IndexNow

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployment
        run: |
          set +e
          for i in $(seq 1 30); do
            if curl -fsS https://shudenhotel.jp/sitemap.xml | grep -q '<lastmod>'; then
              echo "Deployment ready"
              exit 0
            fi
            echo "Waiting for deployment... ($i/30)"
            sleep 20
          done
          echo "Timed out waiting for deployment; submitting URLs anyway"

      - name: Submit URLs to IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          KEY="${INDEXNOW_KEY:-shudenhotelindex2026}"
          curl -fsS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"shudenhotel.jp\",\"key\":\"${KEY}\",\"keyLocation\":\"https://shudenhotel.jp/${KEY}.txt\",\"urlList\":[\"https://shudenhotel.jp/\",\"https://shudenhotel.jp/guides/missed-last-train\",\"https://shudenhotel.jp/guides/taxi-or-hotel\",\"https://shudenhotel.jp/guides/after-live-hotel\",\"https://shudenhotel.jp/guides/nomikai-after-hotel\",\"https://shudenhotel.jp/areas/shinjuku-last-train\",\"https://shudenhotel.jp/areas/shibuya-tonight-hotel\",\"https://shudenhotel.jp/areas/tokyo-station-tonight-hotel\",\"https://shudenhotel.jp/areas/yokohama-last-train\",\"https://shudenhotel.jp/areas/ikebukuro-last-train\",\"https://shudenhotel.jp/areas/ueno-tonight-hotel\",\"https://shudenhotel.jp/areas/shinagawa-business-hotel\",\"https://shudenhotel.jp/areas/namba-last-train\",\"https://shudenhotel.jp/venues/tokyo-dome-after-live\",\"https://shudenhotel.jp/venues/saitama-super-arena-after-live\",\"https://shudenhotel.jp/venues/yokohama-arena-after-live\",\"https://shudenhotel.jp/venues/makuhari-messe-after-event\"]}"
