name: IndexNow

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for https deploy + IndexNow key
        run: |
          set +e
          for i in $(seq 1 40); do
            html="$(curl -fsS https://shudenhotel.jp/ || true)"
            key_code="$(curl -sS -o /dev/null -w '%{http_code}' https://shudenhotel.jp/shudenhotelindex2026.txt || echo 000)"
            if printf '%s' "$html" | grep -q 'rel="canonical" href="https://shudenhotel.jp' \
              && [[ "$key_code" == "200" ]]; then
              echo "Deployment ready (https canonical + IndexNow key)"
              exit 0
            fi
            echo "Waiting for deployment... ($i/40) key=$key_code"
            sleep 15
          done
          echo "Timed out waiting for deployment; submitting URLs anyway"

      - name: Submit URLs to IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          set +e
          KEY="${INDEXNOW_KEY:-shudenhotelindex2026}"
          PAYLOAD=$(cat <<EOF
          {"host":"shudenhotel.jp","key":"${KEY}","keyLocation":"https://shudenhotel.jp/${KEY}.txt","urlList":["https://shudenhotel.jp/","https://shudenhotel.jp/guides/missed-last-train","https://shudenhotel.jp/guides/taxi-or-hotel","https://shudenhotel.jp/guides/after-live-hotel","https://shudenhotel.jp/guides/nomikai-after-hotel","https://shudenhotel.jp/areas/shinjuku-last-train","https://shudenhotel.jp/areas/shibuya-tonight-hotel","https://shudenhotel.jp/areas/tokyo-station-tonight-hotel","https://shudenhotel.jp/areas/yokohama-last-train","https://shudenhotel.jp/areas/ikebukuro-last-train","https://shudenhotel.jp/areas/ueno-tonight-hotel","https://shudenhotel.jp/areas/shinagawa-business-hotel","https://shudenhotel.jp/areas/namba-last-train","https://shudenhotel.jp/venues/tokyo-dome-after-live","https://shudenhotel.jp/venues/saitama-super-arena-after-live","https://shudenhotel.jp/venues/yokohama-arena-after-live","https://shudenhotel.jp/venues/makuhari-messe-after-event"]}
          EOF
          )
          for attempt in 1 2 3 4 5; do
            code="$(curl -sS -o /tmp/indexnow.json -w '%{http_code}' -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d "$PAYLOAD" || echo 000)"
            echo "Attempt $attempt -> HTTP $code"
            cat /tmp/indexnow.json; echo
            if [[ "$code" == "200" || "$code" == "202" ]]; then
              exit 0
            fi
            sleep $((attempt * 20))
          done
          echo "IndexNow still failing; key may need Cloudflare allowlist for IndexNow crawlers"
          exit 0
