name: BOOTH rollout

on:
  workflow_dispatch:
    inputs:
      owner:
        description: GitHub org or user that owns the repositories
        required: true
        default: syunnjack
        type: string

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Roll out BOOTH support links
        env:
          GH_TOKEN: ${{ secrets.BOOTH_ROLLOUT_PAT }}
          GITHUB_OWNER: ${{ inputs.owner }}
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "Set repository secret BOOTH_ROLLOUT_PAT (classic PAT with repo scope)."
            exit 1
          fi
          chmod +x scripts/booth-rollout/*.sh
          ./scripts/booth-rollout/rollout-all-repos.sh
