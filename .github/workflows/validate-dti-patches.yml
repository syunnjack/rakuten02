name: Validate DTI patches

on:
  push:
    paths:
      - 'patches/free-sample-hub/**'
      - 'patches/hey-douga-guide/**'
  pull_request:
    paths:
      - 'patches/free-sample-hub/**'
      - 'patches/hey-douga-guide/**'

jobs:
  apply-patches:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - repo: hey-douga-guide
            patches: patches/hey-douga-guide/*.patch
          - repo: free-sample-hub
            patches: patches/free-sample-hub/*.patch
    steps:
      - uses: actions/checkout@v4

      - name: Clone ${{ matrix.repo }}
        run: git clone --depth 1 https://github.com/syunnjack/${{ matrix.repo }}.git /tmp/${{ matrix.repo }}

      - name: Apply patches
        run: |
          cd /tmp/${{ matrix.repo }}
          for patch in $GITHUB_WORKSPACE/${{ matrix.patches }}; do
            echo "Applying $(basename "$patch")"
            git am "$patch"
          done
