name: Validate DTI patches

on:
  push:
    paths:
      - 'patches/free-sample-hub/**'
      - 'patches/hey-douga-guide/**'
      - '.github/workflows/validate-dti-patches.yml'
  pull_request:
    paths:
      - 'patches/free-sample-hub/**'
      - 'patches/hey-douga-guide/**'
      - '.github/workflows/validate-dti-patches.yml'

jobs:
  apply-patches:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - repo: hey-douga-guide
            # 0001/0002 already on master; apply open Devin follow-ups
            patch_glob: "patches/hey-douga-guide/000[345]*.patch"
          - repo: free-sample-hub
            patch_glob: "patches/free-sample-hub/0004*.patch"
    steps:
      - uses: actions/checkout@v4

      - name: Clone ${{ matrix.repo }}
        run: git clone --depth 40 https://github.com/syunnjack/${{ matrix.repo }}.git /tmp/${{ matrix.repo }}

      - name: Apply patches
        run: |
          set -euo pipefail
          cd /tmp/${{ matrix.repo }}
          shopt -s nullglob
          patches=($GITHUB_WORKSPACE/${{ matrix.patch_glob }})
          if [[ ${#patches[@]} -eq 0 ]]; then
            echo "No patches matched; ok"
            exit 0
          fi
          for patch in "${patches[@]}"; do
            echo "======== $(basename "$patch") ========"
            git am "$patch"
          done
