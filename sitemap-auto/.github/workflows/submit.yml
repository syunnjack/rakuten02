name: Sitemap Auto Submit

on:
  schedule:
    # 毎時（記事更新の取りこぼし防止）
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Force submit even if unchanged
        required: false
        default: "false"
        type: boolean
      site:
        description: Optional site id
        required: false
        default: ""
        type: string
  repository_dispatch:
    types: [sitemap-updated, content-published]

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Restore sitemap state
        uses: actions/cache@v4
        with:
          path: .sitemap-auto
          key: sitemap-auto-state-${{ github.run_id }}
          restore-keys: |
            sitemap-auto-state-

      - name: Prepare sites.json
        run: |
          if [ ! -f sites.json ]; then
            cp sites.example.json sites.json
          fi

      - name: Run
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          ARGS=(run --config sites.json --wait)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            ARGS+=(--force)
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.site }}" ]; then
            ARGS+=(--site "${{ inputs.site }}")
          fi
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            SITE_ID="$(jq -r '.client_payload.site // empty' "$GITHUB_EVENT_PATH")"
            if [ -n "$SITE_ID" ]; then
              ARGS+=(--site "$SITE_ID")
            fi
            ARGS+=(--force)
          fi
          node ./bin/sitemap-auto.mjs "${ARGS[@]}"
