services:
  - type: web
    name: shudenhotel
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PUBLIC_BASE_URL
        value: https://shudenhotel.jp
      - key: RAKUTEN_APPLICATION_ID
        sync: false
      - key: RAKUTEN_AFFILIATE_ID
        sync: false
