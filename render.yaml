services:
  - type: web
    name: shudenhotel
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    domains:
      - shudenhotel.jp
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PUBLIC_BASE_URL
        value: https://shudenhotel.jp
      - key: RAKUTEN_APPLICATION_ID
        sync: false
      - key: RAKUTEN_AFFILIATE_ID
        sync: false
      - key: RAKUTEN_ACCESS_KEY
        sync: false
      - key: RAKUTEN_ALLOWED_ORIGIN
        value: https://shudenhotel.jp
      - key: GOOGLE_ANALYTICS_MEASUREMENT_ID
        sync: false
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      - key: INDEXNOW_KEY
        value: shudenhotelindex2026
      - key: DOTNET_hostBuilder__reloadConfigOnChange
        value: "false"
