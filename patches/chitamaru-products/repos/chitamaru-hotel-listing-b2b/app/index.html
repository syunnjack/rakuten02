<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ホテル・簡易宿所の終電サイト掲載 | 知多丸</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="wrap">
    <p class="brand">知多丸</p>
    <h1>ホテル・簡易宿所の終電サイト掲載</h1>
    <p class="lead">終電・ホテル比較サイトへの宿泊施設掲載枠。計測付きの店舗ページを提供するB2Bメニューです。</p>
    <section class="panel">
      <label for="input">入力</label>
      <textarea id="input" rows="6" placeholder="ここに内容を入力…"></textarea>
      <div class="row">
        <button type="button" id="run">生成する</button>
        <button type="button" id="copy" class="ghost">コピー</button>
      </div>
      <label for="output">出力</label>
      <textarea id="output" rows="8" readonly></textarea>
    </section>
    <p class="foot">買い切り想定 ¥5,000〜/月 — <a href="https://chitamaru.booth.pm/items/hotel-listing-b2b">BOOTH</a></p>
  </main>
  <script src="./app.js"></script>
</body>
</html>
