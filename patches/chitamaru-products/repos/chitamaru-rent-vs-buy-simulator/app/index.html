<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>家賃vs購入 簡易シミュレータ | 知多丸</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="wrap">
    <p class="brand">知多丸</p>
    <h1>家賃vs購入 簡易シミュレータ</h1>
    <p class="lead">家賃・購入・金利・修繕などの前提を入れ、家賃継続と購入を比較する簡易シミュレータです。</p>
    <section class="panel">
      <label for="input">入力</label>
      <textarea id="input" rows="6" placeholder="ここに内容を入力…"></textarea>
      <div class="row">
        <button type="button" id="run">生成する</button>
        <button type="button" id="copy" class="ghost">コピー</button>
      </div>
      <label for="output">出力</label>
      <textarea id="output" rows="8" readonly></textarea>
    </section>
    <p class="foot">買い切り想定 ¥980 — <a href="https://chitamaru.booth.pm/items/rent-vs-buy-simulator">BOOTH</a></p>
  </main>
  <script src="./app.js"></script>
</body>
</html>
