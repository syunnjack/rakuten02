<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>サイト健康診断（単発） | 知多丸</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="wrap">
    <p class="brand">知多丸</p>
    <h1>サイト健康診断（単発）</h1>
    <p class="lead">SEO・計測・公開設定を単発で診断するサービスメニュー（公開キットの上位）。</p>
    <section class="panel">
      <label for="input">入力</label>
      <textarea id="input" rows="6" placeholder="ここに内容を入力…"></textarea>
      <div class="row">
        <button type="button" id="run">生成する</button>
        <button type="button" id="copy" class="ghost">コピー</button>
      </div>
      <label for="output">出力</label>
      <textarea id="output" rows="8" readonly></textarea>
    </section>
    <p class="foot">買い切り想定 ¥9,800/件 — <a href="https://chitamaru.booth.pm/items/site-health-audit-service">BOOTH</a></p>
  </main>
  <script src="./app.js"></script>
</body>
</html>
