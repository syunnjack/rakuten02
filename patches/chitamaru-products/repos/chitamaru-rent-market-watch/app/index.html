<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>賃料相場ウォッチ（市区町村） | 知多丸</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="wrap">
    <p class="brand">知多丸</p>
    <h1>賃料相場ウォッチ（市区町村）</h1>
    <p class="lead">市区町村単位の賃料相場をウォッチし、変動を追う個人向け月額サービス案です。</p>
    <section class="panel">
      <label for="input">入力</label>
      <textarea id="input" rows="6" placeholder="ここに内容を入力…"></textarea>
      <div class="row">
        <button type="button" id="run">生成する</button>
        <button type="button" id="copy" class="ghost">コピー</button>
      </div>
      <label for="output">出力</label>
      <textarea id="output" rows="8" readonly></textarea>
    </section>
    <p class="foot">買い切り想定 ¥680/月 — <a href="https://chitamaru.booth.pm/items/rent-market-watch">BOOTH</a></p>
  </main>
  <script src="./app.js"></script>
</body>
</html>
